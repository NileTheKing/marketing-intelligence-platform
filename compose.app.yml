services:
  controller:
    image: confluentinc/cp-kafka:7.9.0
    container_name: kafka-controller
    networks:
      - axon-network
    environment:
      KAFKA_PROCESS_ROLES: "controller"
      KAFKA_NODE_ID: 1
      KAFKA_CLUSTER_ID: "O69UWjQJRFCIpj8R7rV50A"
      CLUSTER_ID: "O69UWjQJRFCIpj8R7rV50A"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@controller:9093"
      KAFKA_LISTENERS: "CONTROLLER://:9093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
    volumes:
      - controller_data:/var/lib/kafka/data

  broker:
    image: confluentinc/cp-kafka:7.9.0
    container_name: broker_1
    depends_on:
      - controller
    ports:
      - "127.0.0.1:9092:9092"
    networks:
      - axon-network
    environment:
      KAFKA_PROCESS_ROLES: "broker"
      KAFKA_NODE_ID: 2
      CLUSTER_ID: "O69UWjQJRFCIpj8R7rV50A"
      KAFKA_CLUSTER_ID: "O69UWjQJRFCIpj8R7rV50A"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@controller:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENERS: "PLAINTEXT_INTERNAL://:29092,PLAINTEXT_EXTERNAL://:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT_INTERNAL://broker_1:29092,PLAINTEXT_EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT_INTERNAL:PLAINTEXT,PLAINTEXT_EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT_INTERNAL"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    volumes:
      - broker_data:/var/lib/kafka/data

  kafka-init:
    image: confluentinc/cp-kafka:7.9.0
    container_name: kafka-init
    depends_on:
      broker:
        condition: service_started
    networks:
      - axon-network
    volumes:
      - ./kafka-init/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    restart: "no"

  mysql:
    image: mysql:8.0
    container_name: axon-mysql
    restart: always
    ports:
      - "127.0.0.1:3306:3306"
    networks:
      - axon-network
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-axon}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-axon_db}
      MYSQL_USER: ${DB_USERNAME:-axon_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-axon1234}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:alpine
    container_name: axon-redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - axon-network
    command: redis-server --requirepass ${REDIS_PASSWORD:-axon1234} --save ""
    volumes:
      - redis_data:/data

  core-service:
    build:
      context: .
      dockerfile: core-service/Dockerfile
    container_name: axon-core
    depends_on:
      - mysql
      - redis
      - broker
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - axon-network
    environment:
      SPRING_PROFILES_ACTIVE: ${CORE_SPRING_PROFILES_ACTIVE:-loadtest}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://mysql:3306/axon_db?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true}
      DB_USERNAME: ${DB_USERNAME:-axon_user}
      DB_PASSWORD: ${DB_PASSWORD:-axon1234}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-axon1234}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: broker_1:29092
      AXON_ENTRY_SERVICE_URL: http://entry-service:8081
      JWT_SECRET: ${JWT_SECRET:-local-compose-development-jwt-secret-32-bytes-minimum}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-local-client-id}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-local-client-secret}
      AXON_ADMIN_EMAILS: ${AXON_ADMIN_EMAILS:-}
      TRIAGE_SERVICE_TOKEN: ${TRIAGE_SERVICE_TOKEN:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MANAGEMENT_HEALTH_ELASTICSEARCH_ENABLED: ${MANAGEMENT_HEALTH_ELASTICSEARCH_ENABLED:-false}

  ai-triage-mysql:
    image: mysql:8.0
    container_name: axon-ai-triage-mysql
    profiles: ["ai"]
    restart: unless-stopped
    networks:
      - axon-network
    environment:
      MYSQL_ROOT_PASSWORD: ${AI_TRIAGE_MYSQL_ROOT_PASSWORD:-change-me}
      MYSQL_DATABASE: ${AI_TRIAGE_DB_NAME:-axon_ai_triage}
      MYSQL_USER: ${AI_TRIAGE_DB_USERNAME:-ai_triage}
      MYSQL_PASSWORD: ${AI_TRIAGE_DB_PASSWORD:-change-me}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ai_triage_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  ai-triage-service:
    build:
      context: ./ai-triage-service
    container_name: axon-ai-triage
    profiles: ["ai"]
    restart: unless-stopped
    depends_on:
      core-service:
        condition: service_started
      ai-triage-mysql:
        condition: service_healthy
    networks:
      - axon-network
    environment:
      CORE_INTERNAL_BASE_URL: http://core-service:8080
      CORE_TRIAGE_SERVICE_TOKEN: ${TRIAGE_SERVICE_TOKEN:-}
      TRIAGE_POLL_SECONDS: ${TRIAGE_POLL_SECONDS:-5}
      LANGGRAPH_CHECKPOINT_MYSQL_URL: >-
        mysql+pymysql://${AI_TRIAGE_DB_USERNAME:-ai_triage}:${AI_TRIAGE_DB_PASSWORD:-change-me}@ai-triage-mysql:3306/${AI_TRIAGE_DB_NAME:-axon_ai_triage}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_CHANNEL_ID: ${SLACK_CHANNEL_ID:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      SLACK_ALLOWED_USER_IDS: ${SLACK_ALLOWED_USER_IDS:-}

  entry-service:
    build:
      context: .
      dockerfile: entry-service/Dockerfile
    container_name: axon-entry
    depends_on:
      - redis
      - broker
      - core-service
    ports:
      - "127.0.0.1:8081:8081"
    networks:
      - axon-network
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-axon1234}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: broker_1:29092
      AXON_CORE_SERVICE_BASE_URL: http://core-service:8080
      AXON_CORS_ALLOWED_ORIGINS: ${AXON_CORS_ALLOWED_ORIGINS:-https://axon.opicnic.xyz}
      JWT_SECRET: ${JWT_SECRET:-local-compose-development-jwt-secret-32-bytes-minimum}
      PAYMENT_TOKEN_SECRET: ${PAYMENT_TOKEN_SECRET:-change-this-payment-secret}

  axon-nginx:
    image: nginx:1.27-alpine
    container_name: axon-nginx
    depends_on:
      - core-service
      - entry-service
    ports:
      - "127.0.0.1:28080:80"
    ulimits:
      nofile:
        soft: 16384
        hard: 16384
    networks:
      - axon-network
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/axon.conf:/etc/nginx/conf.d/default.conf:ro

networks:
  axon-network:
    driver: bridge

volumes:
  controller_data:
  broker_data:
  mysql_data:
  redis_data:
  ai_triage_mysql_data:
