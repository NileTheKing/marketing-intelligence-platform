# application.yml
spring:
  profiles:
    include: oauth, gemini
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/axon_db?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:changeme}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20  # Increased from default 10 to handle concurrent batch processing
      minimum-idle: 10
      connection-timeout: 10000  # 10s - Fail fast instead of waiting 30s
      max-lifetime: 600000  # 10 minutes
  jpa:
    hibernate:
      ddl-auto: update # Use 'validate' in production
    properties:
      hibernate:
        format_sql: true
        show_sql: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:changeme}
  sql:
    init:
      mode: never
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        spring.json.add.type.headers: true
        enable.idempotence: true
    consumer:
      group-id: axon-group
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      isolation-level: read_committed
      properties:
        max.poll.records: 20
        spring.json.trusted.packages: "*"
    listener:
      type: batch
      ack-mode: batch
  task:
    scheduling:
      pool:
        size: 2
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

gemini:
  api:
    key: ${GEMINI_API_KEY:}
    connect-timeout: ${GEMINI_CONNECT_TIMEOUT:2s}
    read-timeout: ${GEMINI_READ_TIMEOUT:10s}

axon:
  entry-service-url: ${AXON_ENTRY_SERVICE_URL:${ENTRY_SERVICE_URL:http://localhost:8081}}
  upload:
    directory: ${AXON_UPLOAD_DIRECTORY:core-service/uploads}
  security:
    admin-emails: ${AXON_ADMIN_EMAILS:}

server:
  forward-headers-strategy: framework

# Actuator and Metrics
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name:core-service}
