<text x="610" y="418" class="body" style="font-weight:500">마케팅</text>
<text x="610" y="446" class="note" style="font-size:15px">대상 조회, 쿠폰 발급, 알림 발송</text>
<text x="610" y="468" class="note" style="font-size:15px">캠페인 성과 분석</text>
