<svg xmlns="http://www.w3.org/2000/svg" width="900" height="980" viewBox="0 0 900 980" role="img" aria-labelledby="title desc">
<title id="title">Axon 시스템 핵심 구조와 구매 후처리 내부</title>
<desc id="desc">상단은 요청 수신 서버, Kafka, 비즈니스 처리 서버와 Redis, Elasticsearch, MySQL의 연결 구조다. 하단은 상단 core-service의 구매 후처리를 확대한 설명으로, 별도의 서버가 아니다. 구매 데이터 저장과 집계 데이터 갱신은 별도 트랜잭션이며, 구매 데이터는 배치 처리와 JDBC 벌크 저장을 사용한다.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#687382"/></marker>
    <marker id="purchase-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#356bd0"/></marker>
    <marker id="behavior-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 4L0 8Z" fill="#d47927"/></marker>
    <style>
      text{font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;font-weight:400;fill:#28323e;text-rendering:optimizeLegibility}
      .title{font-size:20px;font-weight:600;letter-spacing:-0.25px;fill:#202a36}
      .body{font-size:18px;font-weight:400;letter-spacing:-0.15px}
      .note{font-size:15.5px;font-weight:400;fill:#596574}
      .service{font-size:15px;font-weight:400;fill:#697584}
      .edge{font-size:15.5px;fill:#596574}
      .line{fill:none;stroke:#687382;stroke-width:1.3;stroke-linejoin:round;marker-end:url(#arrow)}
      .purchase{fill:none;stroke:#356bd0;stroke-width:1.9;marker-end:url(#purchase-arrow)}
      .behavior{fill:none;stroke:#d47927;stroke-width:1.9;marker-end:url(#behavior-arrow)}
      .box{fill:#fff;stroke:#ccd4de;stroke-width:1}
    </style>
  </defs>
<rect width="900" height="980" fill="#fff"/>
