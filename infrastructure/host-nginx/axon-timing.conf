# Keep the legacy timing format because the FCFS load-test artifact scripts
# consume it. The JSON log is the operational Loki source.
log_format axon_timing '$time_iso8601 status=$status method=$request_method uri=$uri rt=$request_time uct=$upstream_connect_time uht=$upstream_header_time urt=$upstream_response_time us=$upstream_status bytes=$body_bytes_sent';

log_format axon_observability_json escape=json '{'
    '"timestamp":"$time_iso8601",'
    '"service":"host-nginx",'
    '"level":"info",'
    '"event":"http_access",'
    '"request_id":"$request_id",'
    '"method":"$request_method",'
    '"uri":"$uri",'
    '"status":$status,'
    '"request_time_seconds":$request_time,'
    '"upstream_connect_time_seconds":"$upstream_connect_time",'
    '"upstream_header_time_seconds":"$upstream_header_time",'
    '"upstream_response_time_seconds":"$upstream_response_time",'
    '"upstream_status":"$upstream_status"'
    '}';
