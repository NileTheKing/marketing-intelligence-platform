server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Request-Id $request_id;

    location /actuator/ {
        return 404;
    }

    location /test/ {
        return 404;
    }

    location = /api/v1/entries {
        proxy_pass http://entry-service:8081;
    }

    location = /api/v1/coupon-entries {
        proxy_pass http://entry-service:8081;
    }

    location /api/v1/behavior-events {
        proxy_pass http://entry-service:8081;
    }

    location /api/v1/payments/ {
        proxy_pass http://entry-service:8081;
    }

    location /api/v1/test/ {
        proxy_pass http://entry-service:8081;
    }

    # Enabled only when the compose ai profile is running; the AI service itself
    # has no host-published port.
    location = /slack/interactions {
        # Resolve the optional-profile service at request time. Static upstream
        # resolution would make nginx fail before the ai profile is started.
        resolver 127.0.0.11 ipv6=off valid=30s;
        set $ai_triage_upstream ai-triage-service:8000;
        proxy_pass http://$ai_triage_upstream;
    }

    location /api/v1/dashboard/stream/ {
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_pass http://core-service:8080;
    }

    location / {
        proxy_pass http://core-service:8080;
    }
}
