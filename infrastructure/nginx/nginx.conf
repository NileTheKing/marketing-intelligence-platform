user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Preserve the edge-generated correlation ID across the proxy hop. Direct
    # container access still receives an nginx-generated ID.
    map $http_x_request_id $axon_request_id {
        ""      $request_id;
        default $http_x_request_id;
    }

    log_format json escape=json '{'
        '"timestamp":"$time_iso8601",'
        '"service":"axon-nginx",'
        '"level":"info",'
        '"event":"http_access",'
        '"request_id":"$axon_request_id",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"request_time_seconds":$request_time,'
        '"upstream_connect_time_seconds":"$upstream_connect_time",'
        '"upstream_header_time_seconds":"$upstream_header_time",'
        '"upstream_response_time_seconds":"$upstream_response_time",'
        '"upstream_status":"$upstream_status"'
        '}';

    access_log /var/log/nginx/access.log json;

    sendfile on;
    keepalive_timeout 65;

    include /etc/nginx/conf.d/*.conf;
}
