<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axon - 캠페인 관리</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <!-- Tailwind and Font Awesome are kept only for the create/edit modals built by admin_modal_handler.js. -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous"></script>
    <script th:src="@{/js/common.js}"></script>
    <link rel="stylesheet" th:href="@{/css/console.css}">
    <style>
        .board { display: grid; grid-template-columns: 232px minmax(0, 1fr); gap: 10px; margin-top: 18px; align-items: start; }
        .list-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--border); }
        .list-head b { font-size: 12px; }
        .c-item { padding: 9px 12px; border-bottom: 1px solid var(--border); cursor: pointer; border-left: 2px solid transparent; }
        .c-item:last-child { border-bottom: 0; }
        .c-item:hover { background: #fafaf8; }
        .c-item.active { background: var(--accent-soft); border-left-color: var(--accent); }
        .c-name { display: flex; justify-content: space-between; gap: 6px; font-weight: 600; font-size: 12.5px; }
        .c-name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .c-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 3px; font-size: 11px; color: var(--text-3); }



        .detail-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
        .detail-head h2 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -0.02em; }
        .detail-head .sub { display: flex; gap: 8px; align-items: center; margin-top: 4px; font-size: 12px; color: var(--text-3); }

        #activity-table-body td { white-space: nowrap; }
        #activity-table-body td:first-child > a, #activity-table-body td:first-child > .act-name,
        #activity-table-body .act-sub { display: block; max-width: 170px; overflow: hidden; text-overflow: ellipsis; }
        #activity-content th, #activity-content td { padding-left: 10px; padding-right: 10px; }
        #activity-content th:first-child, #activity-content td:first-child { padding-left: 16px; }
        #activity-table-body .bar { width: 56px; }
        .act-name { font-weight: 600; }
        .act-sub { font-size: 11px; color: var(--text-3); margin-top: 1px; }
        .placeholder { padding: 60px 16px; text-align: center; color: var(--text-3); }
    </style>
</head>
<body class="console">
<th:block th:replace="~{fragments/admin_demo :: banner}"></th:block>
<div class="shell">
    <aside th:replace="~{fragments/console_sidebar :: sidebar('campaigns')}"></aside>

    <main>
        <div class="topbar">
            <div><div class="crumb">운영 / 캠페인</div><h1>캠페인 관리</h1></div>
            <span class="updated"><i></i><span id="campaign-count">-</span></span>
        </div>

        <div class="board">
            <section class="card">
                <div class="list-head">
                    <b>캠페인</b>
                    <button id="create-campaign-btn" class="btn sm">+ 새 캠페인</button>
                </div>
                <div id="campaign-list-container"><div class="empty">불러오는 중</div></div>
            </section>

            <section class="card">
                <div id="no-campaign-selected" class="placeholder">왼쪽에서 캠페인을 선택하세요.</div>

                <div id="campaign-detail-header" hidden>
                    <div class="detail-head">
                        <div>
                            <h2 id="selected-campaign-name"></h2>
                            <div class="sub"><span id="selected-campaign-status" class="pill"></span><span class="num" id="selected-campaign-date"></span></div>
                        </div>
                        <div class="actions">
                            <a href="/admin/coupons" class="btn">쿠폰 목록</a>
                            <button id="create-activity-btn" class="btn primary">+ 새 활동</button>
                        </div>
                    </div>
                    <div class="kpis" style="--kpi-count: 4; border-bottom: 1px solid var(--border);">
                        <div class="kpi"><div class="kpi-label">활동</div><div class="kpi-val num" id="stat-total-activities">0</div><div class="kpi-sub num" id="stat-type-mix">-</div></div>
                        <div class="kpi"><div class="kpi-label">진행 중</div><div class="kpi-val num" id="stat-active-activities">0</div><div class="kpi-sub" id="stat-active-sub">-</div></div>
                        <div class="kpi"><div class="kpi-label">선착순 참여</div><div class="kpi-val num" id="stat-total-participants">0</div><div class="kpi-sub num" id="stat-fill">-</div></div>
                        <div class="kpi"><div class="kpi-label">예산</div><div class="kpi-val num" id="stat-budget">-</div><div class="kpi-sub">활동 예산 합계</div></div>
                    </div>
                </div>

                <div id="activity-content" hidden>
                    <div class="toolbar">
                        <input id="activity-search" type="text" placeholder="활동 이름 검색">
                        <select id="activity-status-filter">
                            <option value="">전체 상태</option>
                            <option value="ACTIVE">진행 중</option>
                            <option value="PAUSED">일시정지</option>
                            <option value="DRAFT">작성 중</option>
                            <option value="ENDED">종료</option>
                        </select>
                        <select id="activity-type-filter">
                            <option value="">전체 유형</option>
                            <option value="FIRST_COME_FIRST_SERVE">선착순</option>
                            <option value="COUPON">쿠폰</option>
                            <option value="GIVEAWAY">경품</option>
                        </select>
                    </div>
                    <table>
                        <thead><tr><th>활동</th><th>유형</th><th>상태</th><th>기간</th><th>진행률</th><th class="r">예산</th><th style="width:36px"></th></tr></thead>
                        <tbody id="activity-table-body"></tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>
</div>

<script th:src="@{/js/campaign-activity-module.js}"></script>
<script th:src="@{/js/admin_modal_handler.js}"></script>
<script th:src="@{/js/admin_board.js}"></script>
<script th:src="@{/js/axon-tracker-config.js}"></script>
</body>
</html>
