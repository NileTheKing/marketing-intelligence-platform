<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axon - 쿠폰 관리</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" th:href="@{/css/console.css}">
    <script th:src="@{/js/common.js}"></script>
</head>
<body class="console">
<th:block th:replace="~{fragments/admin_demo :: banner}"></th:block>
<div class="shell">
    <aside th:replace="~{fragments/console_sidebar :: sidebar('coupons')}"></aside>
    <main>
        <div class="topbar">
            <div><div class="crumb">운영 / 쿠폰</div><h1>쿠폰 관리</h1></div>
            <button id="create-coupon-btn" class="btn primary">+ 새 쿠폰</button>
        </div>
        <div class="cat"><b>쿠폰 목록</b><span>할인 혜택과 사용 가능한 기간</span></div>
        <section class="card table-wrap"><table>
            <thead><tr><th>쿠폰 이름</th><th>유형</th><th class="r">할인 혜택</th><th>유효기간</th><th>생성일</th><th></th></tr></thead>
            <tbody id="coupon-list-body"><tr><td colspan="6" class="empty">등록된 쿠폰이 없습니다.</td></tr></tbody>
        </table></section>
    </main>
</div>
<div id="create-coupon-modal" class="modal-backdrop hidden">
    <div class="modal-content">
        <div class="modal-header"><h2 id="modal-title" class="modal-title">새 쿠폰 만들기</h2><button id="close-modal-btn" class="modal-close-button" aria-label="닫기">×</button></div>
        <div class="modal-body">
            <form id="create-coupon-form" class="form-stack">
                <input type="hidden" id="couponId" value="">
                <div class="field"><label for="couponName">쿠폰 이름 *</label><input type="text" id="couponName" class="form-input" placeholder="예: 봄맞이 특별 할인"></div>
                <div class="form-row">
                    <div id="discount-amount-group" class="field"><label for="discountAmount">할인 금액 (원)</label><input type="number" id="discountAmount" class="form-input" placeholder="예: 5000"></div>
                    <div id="discount-rate-group" class="field"><label for="discountRate">할인율 (%)</label><input type="number" id="discountRate" class="form-input" placeholder="예: 10"></div>
                </div>
                <p class="form-note">할인 금액과 할인율 중 하나만 입력하세요.</p>
                <div class="field"><label for="minOrderAmount">최소 주문 금액 (선택)</label><input type="number" id="minOrderAmount" class="form-input" placeholder="예: 30000"></div>
                <div class="field"><label for="targetCategory">적용 가능 카테고리 (선택)</label><select id="targetCategory" class="form-select"><option value="">모든 상품</option><option value="TECH">TECH</option><option value="FASHION">FASHION</option><option value="HOME">HOME</option><option value="FOOD">FOOD</option></select></div>
                <div class="form-row">
                    <div class="field"><label for="startDate">시작 날짜 *</label><input type="datetime-local" id="startDate" class="form-input"></div>
                    <div class="field"><label for="endDate">종료 날짜 *</label><input type="datetime-local" id="endDate" class="form-input"></div>
                </div>
            </form>
        </div>
        <div class="modal-footer"><button id="cancel-create-btn" class="btn">취소</button><button id="save-coupon-btn" class="btn primary">생성하기</button></div>
    </div>
</div>
<script src="/js/admin_coupons.js"></script>
<script th:src="@{/js/axon-tracker-config.js}"></script>
</body>
</html>
