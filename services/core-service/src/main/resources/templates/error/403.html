<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security" layout:decorate="~{layout/default}">

<head>
    <title>접근할 수 없는 화면 | OPENRUN</title>
</head>

<body>
    <div layout:fragment="content" class="w-full max-w-[1200px] mx-auto px-4 py-28 text-center">
        <th:block sec:authorize="hasRole('DEMO')">
            <h1 class="text-[24px] font-bold text-black">관리자 데모에서는 볼 수 없는 화면이에요</h1>
            <p class="mt-3 text-[15px] text-[#777]">마이페이지와 장바구니, 구매는 네이버 로그인 후 이용할 수 있어요.</p>
            <div class="mt-8" style="display: flex; justify-content: center; gap: 8px;">
                <a href="/shop" style="border: 1px solid #ccc;"
                    class="px-6 h-12 leading-[46px] rounded bg-white text-black font-bold text-[14px]">쇼핑몰로 돌아가기</a>
                <a href="/admin" class="px-6 h-12 leading-[48px] rounded bg-black text-white font-bold text-[14px]">관리자 화면으로</a>
            </div>
        </th:block>
        <th:block sec:authorize="!hasRole('DEMO')">
            <h1 class="text-[24px] font-bold text-black">접근 권한이 없는 화면이에요</h1>
            <p class="mt-3 text-[15px] text-[#777]">계정 권한을 확인해 주세요.</p>
            <div class="mt-8">
                <a href="/shop" class="inline-block px-6 h-12 leading-[48px] rounded bg-black text-white font-bold text-[14px]">쇼핑몰로 돌아가기</a>
            </div>
        </th:block>
    </div>
</body>

</html>
