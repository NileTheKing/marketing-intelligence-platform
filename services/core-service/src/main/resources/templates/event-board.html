<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axon - 행동 이벤트</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>window.FontAwesomeConfig = {autoReplaceSvg:'nest'};</script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" th:href="@{/css/console.css}">
    <style>
        .event-tools { display:flex; align-items:center; justify-content:space-between; padding:10px 16px; border-bottom:1px solid var(--border); }
        .event-tools label { display:flex; align-items:center; gap:7px; color:var(--text-2); font-size:12px; }
        .event-payload { display:block; max-width:230px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:11px; color:var(--text-2); }
        #pagination { padding:10px 16px; border-top:1px solid var(--border); font-size:11px; color:var(--text-3); }
        #search-filter-bar { flex-wrap:wrap; }
    </style>
    <script th:src="@{/js/common.js}"></script>
</head>
<body class="console">
<th:block th:replace="~{fragments/admin_demo :: banner}"></th:block>
<div class="shell">
    <aside th:replace="~{fragments/console_sidebar :: sidebar('events')}"></aside>
    <main id="main-content">
        <div class="topbar"><div><div class="crumb">운영 / 행동 이벤트</div><h1>행동 이벤트 관리</h1></div><button class="btn primary" data-event-create-button>+ 새 이벤트</button></div>
        <div class="cat"><b>수집 이벤트</b><span>이벤트 정의와 트리거 조건</span></div>
        <section id="tags-table-container" class="card table-wrap">
            <div id="search-filter-bar" class="toolbar">
                <input type="text" placeholder="이벤트 이름 또는 설명으로 검색">
                <select><option>상태: 전체</option><option>활성</option><option>비활성</option></select>
                <select><option>유형: 전체</option><option>페이지 뷰</option><option>클릭</option><option>폼 제출</option></select>
                <button class="btn">적용</button>
            </div>
            <div class="event-tools">
                <label><input type="checkbox">전체 선택</label>
                <div class="actions"><button class="btn sm" title="일괄 활성화">활성화</button><button class="btn sm" title="일괄 비활성화">비활성화</button><button class="btn sm danger" title="일괄 삭제">삭제</button></div>
            </div>
            <table><thead><tr><th></th><th>이벤트 이름</th><th>상태</th><th>유형</th><th>트리거 조건</th><th>설명</th><th>최근 수정일</th><th></th></tr></thead>
            <tbody data-event-table-body><tr><td colspan="8" class="empty">아직 등록된 이벤트가 없습니다.</td></tr></tbody></table>
            <div id="pagination">총 <span data-event-count>0</span>개 이벤트</div>
        </section>
    </main>
</div>
  <!-- Event create/edit modal -->
  <div id="event-modal" class="modal-backdrop hidden">
    <div class="modal-content">
      <div class="modal-header">
        <div>
          <h2 class="modal-title" data-event-modal-title>이벤트 생성</h2>
          <p class="form-note">트리거 조건을 JSON 형태로 입력해 주세요.</p>
        </div>
        <button class="modal-close-button" data-close-modal>
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <form id="event-form" class="modal-body form-stack">
        <div>
          <label for="event-name" class="form-label">이벤트 이름</label>
          <input id="event-name" type="text" required
            class="form-input"
            placeholder="예: 구매하기 버튼 클릭" />
        </div>

        <div>
          <label for="event-description" class="form-label">설명</label>
          <textarea id="event-description" rows="3"
            class="form-input"
            placeholder="이 이벤트가 추적하는 내용을 설명해 주세요"></textarea>
        </div>

        <div class="form-row">
          <div>
            <label for="event-trigger-type" class="form-label">트리거 타입</label>
            <select id="event-trigger-type" required
              class="form-input">
              <option value="" disabled selected>선택하세요</option>
              <option value="PAGE_VIEW">페이지 뷰</option>
              <option value="CLICK">클릭</option>
              <option value="FORM_SUBMISSION">폼 제출</option>
              <option value="SCROLL_DEPTH">스크롤 도달</option>
            </select>
          </div>
          <div>
            <label for="event-status" class="form-label">상태</label>
            <select id="event-status"
              class="form-input">
              <option value="ACTIVE">활성</option>
              <option value="INACTIVE">비활성</option>
            </select>
          </div>
        </div>

        <div>
          <label for="event-payload" class="form-label">트리거 조건(JSON)</label>
          <textarea id="event-payload" rows="6"
            class="form-textarea font-mono"
            placeholder='예) {"trackId": "purchase-button"} 또는 {"selector": "#purchase-now"}'></textarea>
          <p class="form-note low" data-payload-error></p>
        </div>

        <div class="modal-footer">
          <button type="button"
            class="btn"
            data-close-modal>
            취소
          </button>
          <button type="submit"
            class="btn primary">
            저장
          </button>
        </div>
      </form>
    </div>
  </div>


<script src="/admin/events/event-board.js"></script>
<script th:src="@{/js/axon-tracker-config.js}"></script>
</body>
</html>
