<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">

<head>
    <title th:text="${product.name} + ' | OPENRUN'">OPENRUN</title>
</head>

<body>
    <div layout:fragment="content" class="w-full max-w-[1200px] mx-auto px-4 pt-5 pb-16">

        <nav class="text-[13px] text-[#999] mb-5" aria-label="카테고리 경로">
            <a href="/shop" class="hover:text-black">홈</a>
            <th:block th:if="${categoryLabel != null}">
                <span class="mx-1.5">&gt;</span>
                <a th:href="@{/shop(category=${product.category})}" class="hover:text-black" th:text="${categoryLabel}">디지털</a>
            </th:block>
        </nav>

        <div class="grid grid-cols-[1fr_440px] gap-14" style="align-items: start;">
            <div class="aspect-square rounded overflow-hidden bg-[#f3f3f1]">
                <img th:if="${product.imageUrl != null}" th:src="${product.imageUrl}" th:alt="${product.name}"
                    class="w-full h-full object-cover">
                <div th:unless="${product.imageUrl != null}"
                    class="w-full h-full flex items-center justify-center text-[22px] font-semibold text-[#b5b3ad]"
                    th:text="${product.brand}">brand</div>
            </div>

            <div class="sticky top-36">
                <a th:href="@{/shop(category=${product.category})}" class="text-[15px] font-bold text-black hover:underline"
                    th:text="${product.brand} + ' >'">brand &gt;</a>
                <h1 class="mt-2 text-[22px] leading-snug text-[#222]" th:text="${product.name}">상품명</h1>

                <div class="mt-6">
                    <div th:if="${product.discountRate > 0}" class="text-[15px] text-[#aaa] line-through"
                        th:text="${product.originalPrice} + '원'">50,000원</div>
                    <div class="flex items-baseline gap-2">
                        <span th:if="${product.discountRate > 0}" class="text-[26px] font-bold text-[#f0302f]"
                            th:text="${product.discountRate} + '%'">15%</span>
                        <span class="text-[26px] font-bold text-black" th:text="${product.price} + '원'">45,000원</span>
                    </div>
                </div>

                <dl class="mt-7 py-5 border-y border-[#eee] text-[14px] space-y-3">
                    <div class="flex"><dt class="w-16 text-[#888]">배송</dt><dd>무료배송</dd></div>
                    <div class="flex"><dt class="w-16 text-[#888]">도착</dt><dd>모레 도착 예정</dd></div>
                </dl>

                <div class="mt-7 flex gap-2">
                    <button type="button" style="border: 1px solid #ccc;"
                        class="flex-1 h-14 rounded bg-white text-black font-bold text-[15px]">장바구니</button>
                    <button type="button"
                        class="flex-1 h-14 rounded bg-black text-white font-bold text-[15px] hover:opacity-90 transition-opacity"
                        th:onclick="'location.href=\'/checkout?productId=' + ${product.id} + '\''">바로구매</button>
                </div>
            </div>
        </div>

        <section th:unless="${#lists.isEmpty(related)}" class="mt-20">
            <h3 class="text-[20px] font-bold mb-5"
                th:text="${categoryLabel != null} ? ${categoryLabel} + ' 인기 상품' : '인기 상품'">인기 상품</h3>
            <div class="grid grid-cols-4 gap-x-4 gap-y-10">
                <div th:each="item : ${related}">
                    <a th:replace="~{fragments/product_card :: card(${item}, null)}"></a>
                </div>
            </div>
        </section>

    </div>
</body>

</html>
